name: ha-cubestore

# HA-fork-specific CI. Runs only on ha-main and on PRs that touch the fork's
# new code. Upstream master.yml is unchanged and continues to run on `master`.
#
# Goal: catch dependency conflicts / build breakage in cubestore introduced
# by the new raft module before they land on ha-main, without paying for
# upstream's full driver-tests matrix on every fork push.

on:
  push:
    branches: [ha-main]
    paths:
      - 'rust/cubestore/**'
      - 'HA.md'
      - 'docs/ha/**'
      - '.github/workflows/ha-cubestore.yml'
  pull_request:
    branches: [ha-main]
    paths:
      - 'rust/cubestore/**'
      - '.github/workflows/ha-cubestore.yml'

permissions:
  contents: read

jobs:
  # Fast feedback: codec / unit tests of the new raft module in isolation.
  # The mini-crate has no upstream-cubestore deps, so it's seconds to compile.
  raft-codec-tests:
    name: raft codec — isolated unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Build mini-crate from raft/command.rs
        run: |
          mkdir -p /tmp/m1/src
          cp rust/cubestore/cubestore/src/raft/command.rs /tmp/m1/src/lib.rs
          cat > /tmp/m1/Cargo.toml <<'EOF'
          [package]
          name = "ha-codec-test"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          serde = "1"
          serde_derive = "1"
          flexbuffers = "2.0"
          [lib]
          path = "src/lib.rs"
          EOF

      - name: cargo test
        working-directory: /tmp/m1
        run: cargo test --release --no-fail-fast

  # Slow feedback: full cubestore cargo check to catch any conflicts the
  # new raft / slog deps introduce against the existing dependency tree.
  #
  # Runs on the project's self-hosted Linux x64 runner — much faster
  # than ubuntu-latest because the cargo target is persistent across
  # runs (warm rebuild ~30s vs cold ~6-10 min on hosted).
  cubestore-check:
    name: cubestore cargo check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/cubestore/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build prereqs (cmake, sasl, libclang, etc.)
        # Probe for everything before invoking sudo. On the self-hosted
        # runner the prereqs are already installed from prior runs, and an
        # earlier run hung for 90 minutes inside `sudo apt-get` (likely
        # held dpkg lock or NOPASSWD policy quirk). Skip apt entirely on
        # the happy path.
        run: |
          have() { command -v "$1" >/dev/null 2>&1; }
          libs() { pkg-config --exists "$@" 2>/dev/null; }
          if have cmake && have cc && have clang && have pkg-config \
             && libs openssl libsasl2 libpq liblz4 libzstd; then
            echo "Build prereqs already present, skipping apt-get."
            exit 0
          fi
          # Cap apt at 10 minutes so a stuck dpkg lock fails loud, not silent.
          timeout 600 sudo apt-get update -qq || true
          timeout 600 sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libssl-dev libsasl2-dev libpq-dev liblz4-dev libzstd-dev \
            clang libclang-dev || true

      - name: Install Rust toolchain pinned in rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-01
          components: rustfmt,clippy

      - name: cargo check (cubestore + tests)
        working-directory: rust/cubestore
        run: cargo check --package cubestore --tests --message-format=short

      - name: cargo test raft module (no networking, deterministic)
        working-directory: rust/cubestore
        run: |
          cargo test --package cubestore --lib raft::command::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::storage::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::state_machine::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::rocks_apply::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::raft_meta_store::tests --release --no-fail-fast
          cargo test --package cubestore --lib config::ha_mode_tests --release --no-fail-fast

  # Cross-arch portability: the cube docker images target multi-arch
  # (linux/amd64 + linux/arm64). The macOS-arm64 self-hosted runner
  # catches platform-specific issues (kqueue, mio, ARM64 codegen
  # edges) before they bite real arm64 deployments. cargo check only —
  # full sql-tests under macOS would duplicate the linux/x64 job
  # without proportional bug-finding.
  cubestore-check-macos-arm64:
    name: cubestore cargo check (macOS arm64)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-arm64-cargo-${{ hashFiles('rust/cubestore/**/Cargo.lock') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Install Rust toolchain pinned in rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-01
          components: rustfmt,clippy

      - name: Install macOS build prereqs (protobuf 21)
        # `raft-proto` (transitive from raft-rs) needs `protoc >= 3.1`,
        # but its `protobuf-build` crate at v0.14.1 has a parser that
        # rejects the new protoc 4+ versioning (Google renumbered).
        # Homebrew's mainline `protobuf` formula is now at v34+ which
        # parses as "34.1.x" → rejected. Pin to `protobuf@21` (a
        # frozen versioned formula = protoc 3.21.x) which parses
        # correctly. The linux runner gets the same vintage by
        # default via apt-get.
        run: |
          brew install protobuf@21 || true
          # protobuf@21 is keg-only; export its bin dir for cargo.
          PROTOBUF_BIN="$(brew --prefix protobuf@21)/bin"
          echo "$PROTOBUF_BIN" >> "$GITHUB_PATH"
          "$PROTOBUF_BIN/protoc" --version

      - name: cargo check (cubestore + tests)
        working-directory: rust/cubestore
        run: cargo check --package cubestore --tests --message-format=short

      - name: cargo test raft module (no networking, deterministic)
        working-directory: rust/cubestore
        run: |
          cargo test --package cubestore --lib raft::command::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::storage::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::state_machine::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::rocks_apply::tests --release --no-fail-fast
          cargo test --package cubestore --lib raft::raft_meta_store::tests --release --no-fail-fast
          cargo test --package cubestore --lib config::ha_mode_tests --release --no-fail-fast

  # M3.6 — run a subset of cubestore-sql-tests under
  # `CUBESTORE_HA_MODE=raft` to verify the wrapper + dispatch works
  # end-to-end against the real SQL surface. Single-process tests
  # only — multi-process / cluster tests need M4 (multi-node Raft)
  # before they make sense.
  #
  # Self-hosted runner: piggybacks on the warm cargo target from the
  # cubestore-check job above. Saves ~6 min of cold rebuild.
  sql-tests-ha:
    name: cubestore-sql-tests (HA mode, in_process)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    needs: cubestore-check
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/cubestore/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build prereqs
        # Same skip-if-present guard as cubestore-check. Avoids the dpkg-lock
        # stall that previously cancelled this runner after 90 min.
        run: |
          have() { command -v "$1" >/dev/null 2>&1; }
          libs() { pkg-config --exists "$@" 2>/dev/null; }
          if have cmake && have cc && have clang && have pkg-config \
             && libs openssl libsasl2 libpq liblz4 libzstd; then
            echo "Build prereqs already present, skipping apt-get."
            exit 0
          fi
          timeout 600 sudo apt-get update -qq || true
          timeout 600 sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libssl-dev libsasl2-dev libpq-dev liblz4-dev libzstd-dev \
            clang libclang-dev || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-01
          components: rustfmt,clippy

      - name: cargo test cubestore-sql-tests in_process under HA mode
        working-directory: rust/cubestore
        env:
          CUBESTORE_HA_MODE: raft
          CUBESTORE_NODE_ID: 1
          RUST_LOG: warn,cubestore=info
        # Use `--no-fail-fast` so the log shows every failing test,
        # not just the first — that gives the M3.6.x backlog at a
        # glance. The job still goes red if anything fails.
        run: |
          cargo test --package cubestore-sql-tests --release \
            --test in-process --no-fail-fast

  # Helm chart + container image are validated in the consumer repo
  # (agriev/cube-stack-deployment), no need to duplicate here.
